# Netlify runs Next.js through its OpenNext adapter (@netlify/plugin-nextjs),
# which handles routing, image optimization and the headers in next.config.ts.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node 20.9 or newer
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
